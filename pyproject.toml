[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "minutemaker"
version = "2.0.0"
description = "Hot-folder automation for meeting minutes — raw notes to LaTeX/PDF"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "watchdog>=4.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
minutemaker = "minutemaker.cli:main"

[tool.setuptools.packages.find]
include = ["minutemaker*"]

[tool.setuptools.package-data]
minutemaker = ["../templates/**/*"]
